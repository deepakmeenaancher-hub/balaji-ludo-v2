<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BALAJI LUDO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f2f2}
.header{background:#6A1B9A;color:#fff;padding:15px 15px;display:flex;justify-content:space-between;align-items:center}
.header b{font-size:20px;letter-spacing:1px}
.balance{border:1px solid #fff;border-radius:25px;padding:6px 15px;font-size:14px}
.green-btn{margin:15px;background:#0a7a00;color:#fff;text-align:center;padding:14px;border-radius:8px;font-weight:bold;cursor:pointer}
.card{margin:0 15px 15px 15px}
.card b{font-size:18px}
.card small{color:gray}
.bottom{position:fixed;bottom:0;width:100%;display:flex;background:#fff;border-top:1px solid #ddd;padding:8px 0}
.bottom div{flex:1;text-align:center;font-size:13px;color:gray}
.bottom div.active{color:#6A1B9A;font-weight:bold}
</style>
</head>
<body>
<div class="header">
<b>BALAJI LUDO</b>
<div class="balance">Rs. 250</div>
</div>

<div class="green-btn" onclick="window.location.href='room.html'">+ CREATE BATTLE (Rs.100)</div>

<div class="card"><b>Open Battles</b><br><small>No open battle, create one</small></div>
<div class="card"><b>Running Battles</b><br><small>No running battle</small></div>

<div class="bottom">
<div class="active">Home<br>Home</div>
<div onclick="window.location.href='wallet.html'">Wallet<br>Wallet</div>
<div>Profile<br>Profile</div>
</div>
</body>
</html>
