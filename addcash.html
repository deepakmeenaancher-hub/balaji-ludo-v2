<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Add Cash</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5}.box{background:#1a1a2e;color:#fff;margin:10px;border-radius:15px;padding:15px}.box input{width:100%;padding:10px;border-radius:8px;background:#2a2a4e;border:none;color:#fff;margin:10px 0}.chip{background:#2a2a4e;border:1px solid #444;padding:7px 14px;border-radius:20px;display:inline-block;margin:4px;font-size:13px}.pro{background:#0a7a00;color:#fff;width:100%;padding:12px;border:none;border-radius:25px;margin-top:10px;font-weight:bold}</style></head><body>
<div class="box">💰 Choose Amount to Add<br><small>ENTER AMOUNT (₹)</small>
<input id="a" type="number" value="100">
<div><span class="chip" onclick="a.value=100">+₹100</span><span class="chip" onclick="a.value=250">+₹250</span><span class="chip" onclick="a.value=500">+₹500</span><span class="chip" onclick="a.value=2000">+₹2000</span></div>
<button class="pro" onclick="localStorage.setItem('payAmt',document.getElementById('a').value);location.href='qrpay.html'">Proceed to Pay →</button>
</div></body></html>
