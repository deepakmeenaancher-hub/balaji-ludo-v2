<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet - BALAJI LUDO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fff}
.top{background:#6A1B9A;color:#fff;text-align:center;padding:20px 15px}
.top h2{font-size:18px;font-weight:400;margin-bottom:10px}
.top h1{font-size:38px}
.top p{font-size:13px;opacity:0.9;margin-top:5px}
.tabs{display:flex;border-bottom:1px solid #ddd}
.tabs div{flex:1;text-align:center;padding:14px;font-weight:bold;cursor:pointer}
.tabs .active{color:#6A1B9A;border-bottom:3px solid #6A1B9A}
.amount-section{text-align:center;padding:15px}
.amounts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0}
.amt{border:1px solid #6A1B9A;border-radius:25px;padding:8px 20px;cursor:pointer}
.amt.active{background:#6A1B9A;color:#fff}
.add-btn{background:#6A1B9A;color:#fff;border:none;width:90%;margin:15px 5%;padding:14px;border-radius:8px;font-weight:bold;font-size:16px}
.qr-box{text-align:center;padding:15px;display:none}
.qr-box img{width:220px;margin:15px auto;display:block}
.qr-box p{font-size:13px;color:#333}
.paid{background:green;color:#fff;border:none;padding:12px 0;width:90%;margin:15px 5%;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<div class="top">
<h2>Wallet</h2>
<p>Balance</p>
<h1 id="bal">Rs. 1250</h1>
<p>Deposit: Rs. 1250 | Winning: Rs. 0</p>
</div>

<div class="tabs">
<div class="active" id="addTab">Add Cash</div>
<div>Withdraw</div>
</div>

<div class="amount-section">
<p>Select Amount</p>
<div class="amounts">
<div class="amt" onclick="selectAmt(this,100)">Rs. 100</div>
<div class="amt active" onclick="selectAmt(this,250)">Rs. 250</div>
<div class="amt" onclick="selectAmt(this,500)">Rs. 500</div>
<div class="amt" onclick="selectAmt(this,1000)">Rs. 1000</div>
</div>
<button class="add-btn" onclick="showQR()">ADD CASH</button>
</div>

<div class="qr-box" id="qrBox">
<p>Scan & Pay <span id="payAmt">Rs. 250</span></p>
<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=deepakmeenaancher@upi%26am=250%26cu=INR">
<p>Payment ke baad Screenshot WhatsApp karo<br>5 min me balance add ho jayega</p>
<button class="paid" onclick="alert('Admin ko screenshot bhejo, balance add ho jayega')">I HAVE PAID</button>
</div>

<script>
let selected = 250;
function selectAmt(el, amt){
document.querySelectorAll('.amt').forEach(a=>a.classList.remove('active'));
el.classList.add('active');
selected = amt;
document.getElementById('payAmt').innerText = 'Rs. '+amt;
}
function showQR(){
document.getElementById('qrBox').style.display='block';
document.getElementById('qrBox').scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
